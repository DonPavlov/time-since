# Overlay for debug builds: enables the HTTP log viewer on :80.
# Use:  west build -b xiao_esp32c6/esp32c6/hpcore app -- -DEXTRA_CONF_FILE=debug.conf

CONFIG_APP_WEB_DEBUG=y

# HTTP server (serves / and /logs)
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_PARSER=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS_POLL_MAX=6
CONFIG_HTTP_SERVER_MAX_CLIENTS=1
CONFIG_HTTP_SERVER_MAX_STREAMS=2
CONFIG_HTTP_SERVER_STACK_SIZE=2560

# Hostname (router DHCP + log viewer URL)
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="time-since-box"

# Bigger heap — webserver + HTML scratch need headroom
CONFIG_HEAP_MEM_POOL_SIZE=16384
