# Required for LVGL + display work on this app
CONFIG_MAIN_STACK_SIZE=8192

# Peripherals
CONFIG_DISPLAY=y
CONFIG_RTC=y

# LVGL core
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_Z_VDB_SIZE=64

# SSD1309 is monochrome
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y

# Widgets/fonts used by this app
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_10=y

# Per-device runtime power management. Lets idle peripherals (I2C, etc.)
# suspend between transactions. CONFIG_PM (system sleep) MUST stay off
# on this board — deep sleep is entered explicitly via sys_poweroff().
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# GPIO (sleep button) and reboot/poweroff
CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y

# Compiler — size optimizations reduce flash reads and overall power
CONFIG_SIZE_OPTIMIZATIONS=y

# ESP32 WiFi stack + NTP heap headroom + HTTP scratch buffers
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Logging — deferred mode, no UART backend. UART must stay off on this board
# (enabling the serial console freezes the device). Logs are exposed over
# HTTP via src/log_backend_web.c + src/http_log_server.c.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_SERIAL=n

# WiFi (needed for NTP + HTTP log server)
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# ESP32 WiFi: scan all 2.4 GHz channels, pick strongest, auto-reconnect.
# Modem sleep (WIFI_PS_MAX_MODEM) is set at runtime via NET_REQUEST_WIFI_PS
# in src/wifi.c after connect.
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y

# DHCP
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# Hostname for router DHCP table + log viewer URL
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="time-since-box"

# NTP for time synchronization
CONFIG_SNTP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y

# DNS resolver (needed for time.cloudflare.com)
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=5000

# HTTP log server (always on while WiFi is up)
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_PARSER=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS_POLL_MAX=6
CONFIG_HTTP_SERVER_MAX_CLIENTS=1
CONFIG_HTTP_SERVER_MAX_STREAMS=2
CONFIG_HTTP_SERVER_STACK_SIZE=2560
